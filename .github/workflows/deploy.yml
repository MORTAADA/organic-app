name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

# يمنع تشغيل أكثر من عملية Deploy في نفس الوقت.
# إذا بدأت عملية جديدة، يتم إلغاء العملية القديمة.
concurrency:
  group: pages
  cancel-in-progress: true

# الصلاحيات المطلوبة لـ GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # إعداد Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # تثبيت dependencies
      - name: Install dependencies
        run: npm ci

      # فحص TypeScript
      - name: TypeScript check
        run: npm run typecheck

      # بناء المشروع
      - name: Build
        run: npm run build

      # إعداد GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # رفع مجلد dist كـ artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      # نشر artifact على GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
